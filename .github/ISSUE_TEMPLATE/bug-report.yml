name: Bug Report
description: Report a bug in an existing action or the SDK
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: input
    id: action
    attributes:
      label: Action ID (if applicable)
      placeholder: "hello-world"

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Create an action extending BaseAction
        2. Call execute with inputs { ... }
        3. See error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, etc.
      placeholder: |
        - Node: v22.x
        - OS: macOS
